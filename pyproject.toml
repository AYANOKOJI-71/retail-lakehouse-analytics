[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-lakehouse"
version = "0.1.0"
description = "Local-first retail lakehouse with layered storage, quality checks, Spark, dbt, and Airflow orchestration."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.90",
  "duckdb>=1.1.3",
  "matplotlib>=3.9.3",
  "pandas>=2.2.3",
  "pyarrow>=18.1.0",
  "psycopg[binary]>=3.2.3",
  "requests>=2.32.3",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.3"]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
